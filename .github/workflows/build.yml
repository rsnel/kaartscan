name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # releases on v* tags, screenshot commits

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.docs.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags and history, for git describe

      # version name from the tags: 1.9 on tag v1.9, 1.9-3-gabc1234 after it
      - name: Version name
        run: |
          v=$(git describe --tags --match 'v*' --always)
          echo "KAARTSCAN_VERSION_NAME=${v#v}" >> "$GITHUB_ENV"
          echo "::notice title=Version::${v#v} (build $GITHUB_RUN_NUMBER)"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Repository secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
      # Without them the release APK is built unsigned.
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets, release APK will be unsigned"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "KAARTSCAN_KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
            echo "KAARTSCAN_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KAARTSCAN_KEY_ALIAS=$KEY_ALIAS"
            echo "KAARTSCAN_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Unit tests, debug and release APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease

      - name: Show signing certificates
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in app/build/outputs/apk/*/*.apk; do
            name=$(basename "$apk")
            if cert=$("$apksigner" verify --print-certs "$apk" 2>/dev/null | grep -m1 'SHA-256'); then
              echo "::notice title=$name::$cert"
            else
              echo "::notice title=$name::not signed"
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: kaartscan-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kaartscan-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish release for v* tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::Signed release APK missing; add the signing secrets before tagging"
            exit 1
          fi
          cp "$apk" "kaartscan-$GITHUB_REF_NAME.apk"
          gh release create "$GITHUB_REF_NAME" "kaartscan-$GITHUB_REF_NAME.apk" --generate-notes

      # Renders the screens (app/src/test/.../ScreenshotTest.kt) for the
      # website in docs/ and commits them when they changed. Pushes made
      # with the workflow token do not trigger a new run.
      - name: Update screenshots in docs/
        id: screenshots
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          ./gradlew --no-daemon recordRoborazziDebug
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update screenshots"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      # Publish the site only when docs/ changed: in the pushed commits or
      # through new screenshots. A manual run always publishes.
      - name: Did docs/ change?
        id: docs
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          BEFORE: ${{ github.event.before }}
          SCREENSHOTS: ${{ steps.screenshots.outputs.committed }}
        run: |
          changed=false
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ "$SCREENSHOTS" = true ]; then
            changed=true
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            changed=true
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null && [ -n "$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- docs)" ]; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "docs/ changed: $changed"

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  # GitHub Pages, source "GitHub Actions": one deployment per change,
  # after the screenshots are committed
  pages:
    needs: build
    if: needs.build.outputs.docs == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main # includes the screenshot commit of this run
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4

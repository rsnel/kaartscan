name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # for creating releases on v* tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Repository secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
      # Without them the release APK is built unsigned.
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets, release APK will be unsigned"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "KAARTSCAN_KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
            echo "KAARTSCAN_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KAARTSCAN_KEY_ALIAS=$KEY_ALIAS"
            echo "KAARTSCAN_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Unit tests, debug and release APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: kaartscan-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kaartscan-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish release for v* tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::Signed release APK missing; add the signing secrets before tagging"
            exit 1
          fi
          cp "$apk" "kaartscan-$GITHUB_REF_NAME.apk"
          gh release create "$GITHUB_REF_NAME" "kaartscan-$GITHUB_REF_NAME.apk" --generate-notes

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
